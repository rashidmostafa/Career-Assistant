# Render Blueprint — Career Assistant Auth API
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → pick this repo.
#
# Values marked `sync: false` are NOT stored in this repo; Render prompts for
# them at deploy time (and they stay hidden in the dashboard afterwards).
# Values marked `generateValue: true` are generated once by Render — you never
# see or need them, they just have to stay stable across restarts.
services:
  - type: web
    name: career-assistant-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Generated by Render. Rotating these invalidates existing access tokens
      # and forces users to sign in again — harmless, but don't do it casually.
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # Must match `scheme` in app.json so the OAuth callback can deep-link
      # back into the standalone build.
      - key: APP_DEEP_LINK
        value: career-assistant://

      # ── Prompted at deploy time ──────────────────────────────────────────
      # Full public URL of THIS service, no trailing slash. You only know it
      # after the first deploy, so set it then and redeploy:
      #   https://career-assistant-api.onrender.com
      - key: SERVER_BASE_URL
        sync: false

      # mongodb+srv://... from MongoDB Atlas → Connect → Drivers
      - key: MONGODB_URI
        sync: false

      # Google Cloud Console → APIs & Services → Credentials
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Comma-separated origins. Safe to leave blank for a mobile-only client
      # (app.js treats empty as allow-all, and native apps send no Origin header).
      - key: ALLOWED_ORIGINS
        sync: false

      # Origins allowed to receive the OAuth callback, checked alongside
      # ALLOWED_ORIGINS by isAllowedRedirectUri(). The web build MUST be listed
      # here or Google sign-in cannot complete from a browser: the callback
      # appends the session tokens to this URI, so an unlisted origin is
      # refused rather than trusted. Native builds need nothing — they use
      # exp:// and career-assistant://, which are always accepted.
      #   e.g. https://career-assistant.netlify.app
      - key: WEB_ORIGINS
        sync: false

      # Email OTP delivery over the Gmail HTTP API. Render blocks outbound
      # SMTP (25/465/587), so nodemailer times out there no matter what; and
      # third-party senders reject an @gmail.com From under DMARC, which rules
      # them out without a domain of your own. Sending through Gmail itself
      # avoids both. Generate the refresh token with server/get-gmail-token.js.
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM_EMAIL
        sync: false

      # Alternative HTTP sender, usable only with a domain you can authenticate.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false

      # Retained as a fallback for running the server somewhere without the
      # port block (a laptop, a VPS). Unused whenever BREVO_API_KEY is set.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # ── AI providers ─────────────────────────────────────────────────────
      # The general-purpose model key. This used to be
      # EXPO_PUBLIC_OPENAI_API_KEY in the app's .env, which Expo inlines into
      # the JS bundle at build time — meaning it shipped inside the APK and was
      # extractable. routes/ai.js proxies those calls now and the key stays
      # here. Rotate the old one: assume anything that shipped is compromised.
      - key: AI_API_KEY
        sync: false

      # Any OpenAI-compatible endpoint. Changing the provider or model is a
      # dashboard edit now, not an app rebuild.
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-3.6-flash

      # ── Hawk (self-hosted fine-tuned model) ──────────────────────────────
      # Public URL of serve_hawk.py — a tunnel to the GPU box, or a host.
      # Leave blank and /api/ai/hawk/* returns data:null, which every caller
      # already handles by falling back to its deterministic path. Setting it
      # is what "turns Hawk on"; no app rebuild is involved either way.
      - key: HAWK_URL
        sync: false
      # Sent as X-Hawk-Secret. serve_hawk.py ships with no authentication, so
      # set this before Hawk is reachable from outside the LAN.
      - key: HAWK_SECRET
        sync: false

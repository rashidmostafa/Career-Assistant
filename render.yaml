# Render Blueprint — Career Assistant Auth API
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → pick this repo.
#
# Values marked `sync: false` are NOT stored in this repo; Render prompts for
# them at deploy time (and they stay hidden in the dashboard afterwards).
# Values marked `generateValue: true` are generated once by Render — you never
# see or need them, they just have to stay stable across restarts.
services:
  - type: web
    name: career-assistant-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Generated by Render. Rotating these invalidates existing access tokens
      # and forces users to sign in again — harmless, but don't do it casually.
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # Must match `scheme` in app.json so the OAuth callback can deep-link
      # back into the standalone build.
      - key: APP_DEEP_LINK
        value: career-assistant://

      # ── Prompted at deploy time ──────────────────────────────────────────
      # Full public URL of THIS service, no trailing slash. You only know it
      # after the first deploy, so set it then and redeploy:
      #   https://career-assistant-api.onrender.com
      - key: SERVER_BASE_URL
        sync: false

      # mongodb+srv://... from MongoDB Atlas → Connect → Drivers
      - key: MONGODB_URI
        sync: false

      # Google Cloud Console → APIs & Services → Credentials
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Comma-separated origins. Safe to leave blank for a mobile-only client
      # (app.js treats empty as allow-all, and native apps send no Origin header).
      - key: ALLOWED_ORIGINS
        sync: false

      # Email OTP delivery for registration. Without these, sign-up emails
      # silently fail — see server/services/emailService.js.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
